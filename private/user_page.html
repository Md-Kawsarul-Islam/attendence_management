<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard - Attendance</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar user-navbar">
    <div class="logo">🎓 My Attendance</div>
    <ul class="nav-links">
        <li><a href="/user_page.html"><i class="fas fa-check-circle"></i> Mark Attendance</a></li>
        <li><a href="/attendance_report.html"><i class="fas fa-file-alt"></i> My Reports</a></li>
        <li><a href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
    </ul>
</nav>


<!-- Main Content -->
<main class="content">

    <h1>Welcome, <span id="username"></span></h1>

    <!-- Select Course & Date -->
    <div class="card">
        <h2>Select Course & Date</h2>

        <form onsubmit="event.preventDefault(); loadStudents();">
            <select id="courseSelect" required>
                <option value="">Select Course</option>
            </select>

            <input type="date" id="attendanceDate" required>

            <button type="submit">
                <i class="fas fa-users"></i> Load Students
            </button>
        </form>
    </div>


    <!-- Attendance Table -->
    <div class="card attendance-card">
        <h2>Mark Attendance</h2>

        <table class="attendance-table">
            <thead>
            <tr>
                <th>SID</th>
                <th>Name</th>
                <th>Status</th>
            </tr>
            </thead>

            <tbody id="studentList">
            <!-- Students will load here -->
            </tbody>
        </table>

        <button onclick="submitAttendance()" class="submit-btn">
            <i class="fas fa-save"></i> Submit Attendance
        </button>
    </div>

</main>


<!-- Scripts -->
<script src="user.js"></script>

<script>
    // Load logged-in user name
    fetch('/currentUser')
        .then(res => res.json())
        .then(data => {
            document.getElementById("username").textContent = data.name;
        });
</script>

</body>
</html>
