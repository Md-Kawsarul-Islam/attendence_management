</head>

<body>

  </nav>

  <!-- ==================== DASHBOARD ==================== -->

  <div class="dashboard">

```
<aside class="sidebar" id="sidebar">

  <ul>

    <li>
      <button
        type="button"
        onclick="showSection('studentSection')"
      >
        Manage Students
      </button>
    </li>

    <li>
      <button
        type="button"
        onclick="showSection('courseSection')"
      >
        Manage Courses
      </button>
    </li>

    <li>
      <a href="/attendance_report.html">
        Attendance Reports
      </a>
    </li>

  </ul>

</aside>


<!-- ==================== MAIN ==================== -->

<main class="content">

  <h1>
    Welcome,
    <span id="username">Admin</span>
  </h1>


  <!-- ==================== STUDENTS ==================== -->

  <div
    id="studentSection"
    class="section hidden"
  >

    <div class="card">

      <h2>Add Student</h2>

      <form id="studentForm">

        <input
          type="text"
          id="sid"
          placeholder="Student ID"
          required
        >

        <input
          type="text"
          id="sname"
          placeholder="Student Name"
          required
        >

        <input
          type="text"
          id="dept"
          placeholder="Department"
          required
        >

        <button type="submit">
          Add Student
        </button>

      </form>

    </div>


    <div class="card">

      <h2>Student List</h2>


      <div class="search-filter">

        <input
          type="text"
          id="searchInput"
          placeholder="Search by name or ID..."
        >

        <select id="deptFilter">

          <option value="">
            All Departments
          </option>

          <option value="CSE">
            CSE
          </option>

          <option value="EEE">
            EEE
          </option>

          <option value="BBA">
            BBA
          </option>

        </select>

        <button
          type="button"
          onclick="applyFilter()"
        >
          Filter
        </button>

      </div>


      <table class="student-table">

        <thead>

          <tr>
            <th>SID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Action</th>
          </tr>

        </thead>

        <tbody id="studentList"></tbody>

      </table>

    </div>

  </div>


  <!-- ==================== COURSES ==================== -->

  <div
    id="courseSection"
    class="section hidden"
  >

    <div class="card">

      <h2>Add Course</h2>

      <form id="courseForm">

        <input
          type="text"
          id="courseName"
          placeholder="Course Name"
          required
        >

        <button type="submit">
          Add Course
        </button>

      </form>

    </div>


    <div class="card">

      <h2>Course List</h2>

      <table>

        <thead>

          <tr>
            <th>Course ID</th>
            <th>Course Name</th>
            <th>Action</th>
          </tr>

        </thead>

        <tbody id="courseList"></tbody>

      </table>

    </div>

  </div>

</main>
```

  </div>

  <!-- ==================== MENU ==================== -->

  <script>

    function showSection(sectionId) {

      document
        .querySelectorAll(".section")
        .forEach(section => {

          section.classList.add("hidden");

        });


      const section =
        document.getElementById(sectionId);

      if (section) {

        section.classList.remove("hidden");

      }

    }


    function toggleMenu() {

      document
        .getElementById("navLinks")
        .classList.toggle("show");

      document
        .getElementById("sidebar")
        .classList.toggle("show");

    }


    // Show students by default
    document.addEventListener(
      "DOMContentLoaded",
      function () {

        showSection("studentSection");

      }
    );

  </script>

</body>
</html>
