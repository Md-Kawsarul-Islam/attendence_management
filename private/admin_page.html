<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Student & Course Management</title>
  <link rel="stylesheet" href="style.css">
  <script src="admin.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
  <div class="logo">📘 Attendance System </div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
  <ul class="nav-links" id="navLinks">
    <li><a href="/admin_page.html"><i class="fas fa-home"></i> Dashboard</a></li>
    <li><a href="/attendance_report.html"><i class="fas fa-chart-line"></i> Reports</a></li>
    <li><a href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
  </ul>
</nav>

  <!-- Dashboard Layout -->
  <div class="dashboard">
    <aside class="sidebar" id="sidebar">
  <ul>
    <li><button onclick="showSection('studentSection')">Manage Students</button></li>
    <li><button onclick="showSection('courseSection')">Manage Courses</button></li>
    <li><a href="/attendance_report.html">Attendance Reports</a></li>
  </ul>
</aside>


    <main class="content">
      <h1>Welcome, Admin</h1>

      <!-- Student Section -->
      <div id="studentSection" class="section hidden">
        <div class="card">
          <h2>Add Student</h2>
          <form onsubmit="event.preventDefault(); addStudent();">
            <input type="text" id="sid" placeholder="Student ID">
            <input type="text" id="sname" placeholder="Student Name">
            <input type="text" id="dept" placeholder="Department">
            <button type="submit">Add Student</button>
          </form>
        </div>

        <div class="card">
  <h2>Student List</h2>

  <!-- Search & Filter -->
  <div class="search-filter">
    <input type="text" id="searchInput" placeholder="Search by name or ID...">
    <select id="deptFilter">
      <option value="">All Departments</option>
      <option value="CSE">CSE</option>
      <option value="EEE">EEE</option>
      <option value="BBA">BBA</option>
      <!-- Add more departments as needed -->
    </select>
    <button onclick="applyFilter()">Filter</button>
  </div>

  <!-- Student Table -->
  <table class="student-table">
    <thead>
      <tr>
        <th>SID</th>
        <th>Name</th>
        <th>Department</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="studentList"></tbody>
  </table>
</div>

      </div>

      <!-- Course Section -->
      <div id="courseSection" class="section hidden">
        <div class="card">
          <h2>Add Course</h2>
          <form onsubmit="event.preventDefault(); addCourse();">
            <input type="text" id="courseName" placeholder="Course Name">
            <button type="submit">Add Course</button>
          </form>
        </div>

        <div class="card">
          <h2>Course List</h2>
          <table>
            <thead>
              <tr>
                <th>Course ID</th>
                <th>Course Name</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="courseList"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Toggle sections
    function showSection(sectionId) {
      document.querySelectorAll('.section').forEach(sec => sec.classList.add('hidden'));
      document.getElementById(sectionId).classList.remove('hidden');
    }
    function toggleMenu() {
    document.getElementById('navLinks').classList.toggle('show');
    document.getElementById('sidebar').classList.toggle('show');
  }

  </script>
</body>
</html>
