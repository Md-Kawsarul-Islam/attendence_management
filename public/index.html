<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Attendance System - Login & Register</title>

  <link rel="stylesheet" href="style.css">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >
</head>

<body class="login-body">

  <div class="container">

    <!-- ==================== LOGIN FORM ==================== -->
    <div class="form-box active" id="login-form">

      <form id="loginForm">

        <h2>
          <i class="fas fa-sign-in-alt"></i>
          Login
        </h2>

        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input
            type="email"
            id="loginEmail"
            name="email"
            placeholder="Email"
            required
          >
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input
            type="password"
            id="loginPassword"
            name="password"
            placeholder="Password"
            required
          >
        </div>

        <button type="submit" class="login-btn">
          Login
        </button>

        <p>
          Don't have an account?
          <a href="#" onclick="showForm('register-form'); return false;">
            Register
          </a>
        </p>

      </form>

      <p id="login-error" style="color:red;"></p>

    </div>


    <!-- ==================== REGISTER FORM ==================== -->
    <div class="form-box" id="register-form">

      <form id="registerForm">

        <h2>
          <i class="fas fa-user-plus"></i>
          Register
        </h2>

        <div class="input-group">
          <i class="fas fa-user"></i>
          <input
            type="text"
            id="registerName"
            name="name"
            placeholder="Name"
            required
          >
        </div>

        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input
            type="email"
            id="registerEmail"
            name="email"
            placeholder="Email"
            required
          >
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input
            type="password"
            id="registerPassword"
            name="password"
            placeholder="Password"
            required
          >
        </div>

        <div class="input-group">
          <i class="fas fa-users"></i>

          <select id="registerRole" name="role" required>

            <option value="">
              --Select Role--
            </option>

            <option value="user">
              User
            </option>

            <option value="admin">
              Admin
            </option>

          </select>

        </div>

        <button type="submit" class="register-btn">
          Register
        </button>

        <p>
          Already have an account?
          <a href="#" onclick="showForm('login-form'); return false;">
            Login
          </a>
        </p>

      </form>

      <p id="register-error" style="color:red;"></p>

    </div>

  </div>


  <!-- ==================== SCRIPT ==================== -->
<script>
const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", function (event) {
    event.preventDefault();

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const errorElement =
        document.getElementById("login-error");

    errorElement.textContent = "";

    if (!email || !password) {
        errorElement.textContent =
            "Email and password are required.";
        return;
    }

    /*
     * Important:
     * Submit directly to Render.
     *
     * This makes Render the browser's first-party
     * navigation context, allowing connect.sid
     * to be stored and used correctly.
     */

    const form = document.createElement("form");

    form.method = "POST";

    form.action =
        "https://attendence-management-xvy5.onrender.com/login";

    const emailInput =
        document.createElement("input");

    emailInput.type = "hidden";
    emailInput.name = "email";
    emailInput.value = email;

    const passwordInput =
        document.createElement("input");

    passwordInput.type = "hidden";
    passwordInput.name = "password";
    passwordInput.value = password;

    form.appendChild(emailInput);
    form.appendChild(passwordInput);

    document.body.appendChild(form);

    form.submit();
});
</script>

</body>
</html>
