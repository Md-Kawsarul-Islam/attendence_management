  </div>

  <!-- ==================== SCRIPT ==================== -->

  <script>

    const API_URL =
      "https://attendence-management-xvy5.onrender.com";


    // ==================== SHOW LOGIN / REGISTER ====================

    function showForm(formId) {

      document
        .querySelectorAll(".form-box")
        .forEach(box => {
          box.classList.remove("active");
        });

      const selectedForm =
        document.getElementById(formId);

      if (selectedForm) {
        selectedForm.classList.add("active");
      }

    }


    // ==================== LOGIN ====================

    const loginForm =
      document.getElementById("loginForm");


    loginForm.addEventListener(
      "submit",
      function (event) {

        event.preventDefault();

        const email =
          document
            .getElementById("loginEmail")
            .value
            .trim();

        const password =
          document
            .getElementById("loginPassword")
            .value;

        const errorElement =
          document.getElementById("login-error");

        errorElement.textContent = "";


        if (!email || !password) {

          errorElement.textContent =
            "Email and password are required.";

          return;
        }


        /*
         * Submit directly to Render.
         * This allows the Render backend
         * to create the session cookie.
         */

        const form =
          document.createElement("form");

        form.method = "POST";

        form.action =
          `${API_URL}/login`;


        const emailInput =
          document.createElement("input");

        emailInput.type = "hidden";
        emailInput.name = "email";
        emailInput.value = email;


        const passwordInput =
          document.createElement("input");

        passwordInput.type = "hidden";
        passwordInput.name = "password";
        passwordInput.value = password;


        form.appendChild(emailInput);
        form.appendChild(passwordInput);

        document.body.appendChild(form);

        form.submit();

      }
    );


    // ==================== REGISTER ====================

    const registerForm =
      document.getElementById("registerForm");


    registerForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        const name =
          document
            .getElementById("registerName")
            .value
            .trim();

        const email =
          document
            .getElementById("registerEmail")
            .value
            .trim();

        const password =
          document
            .getElementById("registerPassword")
            .value;

        const role =
          document
            .getElementById("registerRole")
            .value;


        const errorElement =
          document.getElementById(
            "register-error"
          );

        errorElement.textContent = "";


        if (!name || !email || !password || !role) {

          errorElement.textContent =
            "Please fill in all fields.";

          return;
        }


        try {

          const response =
            await fetch(
              `${API_URL}/register`,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                  name: name,
                  email: email,
                  password: password,
                  role: role
                })
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            errorElement.textContent =
              data.message ||
              "Registration failed.";

            return;
          }


          // Registration successful

          alert(
            data.message ||
            "Registration successful. Please login."
          );


          // Clear form

          registerForm.reset();


          // Go back to login

          showForm("login-form");

        } catch (error) {

          console.error(
            "Registration error:",
            error
          );

          errorElement.textContent =
            "Unable to connect to server. Please try again.";

        }

      }
    );

  </script>

</body>
</html>
