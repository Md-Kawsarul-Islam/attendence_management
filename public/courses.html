  <!-- ==================== CONTENT ==================== -->

  <main class="content">

```
<h1>
  Manage Courses
</h1>


<!-- ADD COURSE -->

<div class="card">

  <form id="courseManagementForm">

    <input
      type="text"
      id="courseName"
      placeholder="Course Name"
      required
    >

    <button type="submit">
      Add Course
    </button>

  </form>

</div>


<!-- COURSE LIST -->

<div class="card">

  <h2>
    Course List
  </h2>


  <input
    type="text"
    id="courseSearch"
    placeholder="Search courses..."
  >


  <table class="student-table">

    <thead>

      <tr>

        <th>ID</th>

        <th>Course Name</th>

        <th>Action</th>

      </tr>

    </thead>


    <tbody id="courseList">

    </tbody>

  </table>

</div>
```

  </main>

  <script src="admin.js"></script>

  <script>

    document
      .getElementById(
        "courseManagementForm"
      )
      .addEventListener(
        "submit",
        function (event) {

          event.preventDefault();

          addCourse();

        }
      );


    document
      .getElementById(
        "courseSearch"
      )
      .addEventListener(
        "input",
        applyCourseFilter
      );

  </script>

</body>
